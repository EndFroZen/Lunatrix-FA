<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; font-family: system-ui, sans-serif; }
  /* collapsed: thin tab on the left edge */
  #tab {
    position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 8px; height: 64px; border-radius: 0 6px 6px 0; background: #2ea043;
    transition: opacity .2s;
  }
  #bar {
    display: flex; position: absolute; left: 4px; top: 50%; width: 64px; box-sizing: border-box;
    transform: translate(-80px, -50%); opacity: 0;
    transition: transform .25s ease, opacity .25s ease;
    flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 6px; border-radius: 12px; background: rgba(30,30,30,.92);
  }
  body.open #tab { opacity: 0; }
  body.open #bar { transform: translate(0, -50%); opacity: 1; }
  button {
    width: 40px; height: 34px; border: 0; border-radius: 8px; background: transparent;
    color: #fff; cursor: pointer; display: grid; place-items: center; padding: 0;
    font: 600 11px system-ui, sans-serif;
  }
  button:hover { background: rgba(255,255,255,.15); }
  button:focus-visible { outline: 2px solid #fff; }
  button.sel { background: rgba(255,255,255,.22); }
  #mode.on { background: #2ea043; }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .grid { display: grid; grid-template-columns: 24px 24px; gap: 4px; }
  .grid button { width: 24px; height: 24px; border-radius: 6px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid transparent; box-sizing: border-box; }
  [data-color].sel { background: transparent; }
  [data-color].sel .dot { border-color: #fff; }
  hr { width: 36px; border: 0; border-top: 1px solid rgba(255,255,255,.25); margin: 2px 0; }
</style>
</head>
<body>
<div id="tab"></div>
<div id="bar">
  <button id="mode" title="ใช้จอปกติ (เส้นยังอยู่)" aria-label="ใช้จอปกติ">
    <svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="5"/><path d="M12 7v4"/></svg></button>
  <hr>
  <button data-tool="pen" title="ปากกา (P)" aria-label="ปากกา">
    <svg viewBox="0 0 24 24"><path d="M3 21l2-6L16 4l4 4L9 19z"/></svg></button>
  <button data-tool="pencil" title="ดินสอ (N)" aria-label="ดินสอ">
    <svg viewBox="0 0 24 24"><path d="M3 21l2-6L16 4l4 4L9 19z" stroke-dasharray="2 2.5"/><path d="M14 6l4 4"/></svg></button>
  <button data-tool="arrow" title="ลูกศร (A)" aria-label="ลูกศร">
    <svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg></button>
  <button data-tool="rect" title="สี่เหลี่ยม (R) · Shift = จัตุรัส" aria-label="สี่เหลี่ยม">
    <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
  <button data-tool="circle" title="วงกลม (O) · Shift = กลมพอดี" aria-label="วงกลม">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></button>
  <button data-tool="eraser" title="ยางลบ ลบทั้งเส้น (E)" aria-label="ยางลบ">
    <svg viewBox="0 0 24 24"><path d="M8 20h12M4 15l9-9 6 6-8 8H8z"/><path d="M8.5 10.5l6 6"/></svg></button>
  <button data-tool="laser" title="เลเซอร์ชี้ (L) · ไม่ทิ้งเส้นไว้" aria-label="เลเซอร์ชี้">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></button>
  <button data-tool="zoom" title="แว่นขยาย (M) · +/− หรือล้อเมาส์ = ซูม" aria-label="แว่นขยาย">
    <svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M15 15l5 5M7.5 10h5M10 7.5v5"/></svg></button>
  <hr>
  <div class="grid">
    <button data-color="#ff3b30" title="แดง" aria-label="สีแดง"><span class="dot" style="background:#ff3b30"></span></button>
    <button data-color="#ffcc00" title="เหลือง" aria-label="สีเหลือง"><span class="dot" style="background:#ffcc00"></span></button>
    <button data-color="#34c759" title="เขียว" aria-label="สีเขียว"><span class="dot" style="background:#34c759"></span></button>
    <button data-color="#0a84ff" title="ฟ้า" aria-label="สีฟ้า"><span class="dot" style="background:#0a84ff"></span></button>
  </div>
  <hr>
  <div class="grid">
    <button data-size="S" title="เล็ก (1)">S</button>
    <button data-size="M" title="กลาง (2)">M</button>
    <button data-size="L" title="ใหญ่ (3)">L</button>
    <button data-size="XL" title="ใหญ่มาก (4)">XL</button>
  </div>
  <hr>
  <button id="undo" title="ย้อนกลับ (Ctrl+Z)" aria-label="ย้อนกลับ">
    <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h11a5 5 0 010 10h-3"/></svg></button>
  <button id="clear" title="ลบทั้งหมด" aria-label="ลบทั้งหมด">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
  <button id="copy" title="คัดลอกภาพหน้าจอ (Ctrl+C)" aria-label="คัดลอกภาพหน้าจอ">
    <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/></svg></button>
  <button id="save" title="บันทึกภาพหน้าจอ (Ctrl+S) → Pictures\Lunatrix" aria-label="บันทึกภาพหน้าจอ">
    <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
  <button id="close" title="ปิดการวาด (Esc)" aria-label="ปิดการวาด">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<script>
  const T = window.__TAURI__, win = T.window.getCurrentWindow();
  const H = 720, OPEN_W = 72, CLOSED_W = 12;   // keep H in sync with tauri.conf.json
  const HIDE_DELAY = 800, ANIM = 250;          // ms; ANIM matches the CSS transition
  const draw = (action, value) => T.event.emitTo('main', 'draw', { action, value });

  let timer;
  document.body.onmouseenter = async () => {
    clearTimeout(timer);
    await win.setSize(new T.dpi.LogicalSize(OPEN_W, H));
    requestAnimationFrame(() => document.body.classList.add('open'));  // next frame so it slides in
  };
  document.body.onmouseleave = () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      document.body.classList.remove('open');                          // slide out...
      timer = setTimeout(() => win.setSize(new T.dpi.LogicalSize(CLOSED_W, H)), ANIM);  // ...then shrink
    }, HIDE_DELAY);
  };

  document.getElementById('mode').onclick = () => T.core.invoke('toggle');
  document.getElementById('undo').onclick = () => draw('undo');
  document.getElementById('clear').onclick = () => draw('clear');
  // overlay needs focus for the clipboard
  for (const id of ['copy', 'save']) document.getElementById(id).onclick = async () => { await T.core.invoke('start_draw'); draw(id); };
  document.getElementById('close').onclick = () => T.core.invoke('close');
  // tool / colour / size: tell the overlay, and go back to drawing
  for (const k of ['tool', 'color', 'size']) {
    document.querySelectorAll(`[data-${k}]`).forEach(b => b.onclick = () => {
      draw(k, b.dataset[k]);
      T.core.invoke('start_draw');
    });
  }

  // mirror the overlay's current tool / colour / size
  T.event.listen('state', ({ payload }) => {
    for (const k of ['tool', 'color', 'size']) {
      document.querySelectorAll(`[data-${k}]`).forEach(b => b.classList.toggle('sel', b.dataset[k] === payload[k]));
    }
  });
  draw('sync');

  // called from Rust: 'hidden' | 'draw' | 'pass'
  function setMode(m) {
    document.getElementById('mode').classList.toggle('on', m === 'pass');
  }
</script>
</body>
</html>
